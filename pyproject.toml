[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "autochart"
dynamic = ["version"]
description = "Automatic 5-fret guitar charts for YARG / Clone Hero from an audio file"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10,<3.13"
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Games/Entertainment",
]
# Ranges known to work. The exact, tested set is in requirements.txt.
# basic-pitch is installed separately with --no-deps (see README): its own metadata pulls TensorFlow,
# which autochart doesn't need (it runs the bundled ONNX model).
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "librosa>=0.10,<0.12",
  "soundfile>=0.12",
  "torch>=2.0",
  "torchaudio>=2.0",
  "demucs==4.0.1",
  "onnxruntime>=1.16",
  "mir-eval>=0.6",
  "pretty-midi>=0.2.9",
  "resampy>=0.2.2,<0.4.3",
  "scikit-learn",
  "setuptools<81",
  "mido>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
autochart = "autochart.cli:main"

[tool.setuptools]
packages = ["autochart"]

[tool.setuptools.dynamic]
version = {attr = "autochart.__version__"}

[tool.pytest.ini_options]
markers = ["slow: needs the models and a few minutes of CPU"]
addopts = "-m 'not slow'"
